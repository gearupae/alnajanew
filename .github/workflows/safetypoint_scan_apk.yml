# Builds the Flutter example app (safetypoint_scan/example) as a release APK.
# Run manually: Actions → "Build Safety Point Scan APK" → Run workflow.
# Download the "safetypoint-scan-apk" artifact and install on your phone.
name: Build Safety Point Scan APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safetypoint_scan/example
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create . --project-name safetypoint_scan_example --org com.safetypoint

      - name: Dependencies
        run: flutter pub get

      - name: Allow HTTP to dev ERP (test installs only)
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          if grep -q 'usesCleartextTraffic' "$MAN"; then exit 0; fi
          sed -i 's/<application/<application android:usesCleartextTraffic="true" /' "$MAN"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: safetypoint-scan-apk
          path: safetypoint_scan/example/build/app/outputs/flutter-apk/app-release.apk
