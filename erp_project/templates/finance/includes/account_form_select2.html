<style>
.account-select2-dropdown {
    z-index: 2000 !important;
}
.account-select2-dropdown .select2-search__field {
    width: 100% !important;
}
.select2-container--bootstrap-5 .select2-selection {
    min-height: 38px;
}
</style>
<script>
(function () {
    function destroyAccountSelect2($el) {
        if ($el.data('select2')) {
            $el.select2('destroy');
        }
    }

    function initAccountSelect2(scope, force) {
        if (typeof window.jQuery === 'undefined' || !window.jQuery.fn.select2) {
            return;
        }
        var $ = window.jQuery;
        var $scope = scope ? $(scope) : $(document);

        $scope.find('.select2-account-parent').each(function () {
            var $el = $(this);
            var hiddenInline = $el.closest('.inline-form-container:not(.show)').length > 0;
            if (!force && hiddenInline) {
                return;
            }
            destroyAccountSelect2($el);
            if (!$el.find('option[value=""]').length) {
                $el.prepend(new Option('', ''));
            }
            $el.select2({
                theme: 'bootstrap-5',
                width: '100%',
                placeholder: $el.data('placeholder') || 'Search existing account…',
                allowClear: true,
                minimumResultsForSearch: 0,
                dropdownParent: $(document.body),
                dropdownCssClass: 'account-select2-dropdown',
            });
        });

    }

    window.initFinanceAccountSelect2 = initAccountSelect2;

    window.openFinanceAccountInlineForm = function () {
        var panel = document.getElementById('accountForm');
        if (!panel) {
            return;
        }
        panel.classList.add('show');
        panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        window.setTimeout(function () {
            initAccountSelect2(panel, true);
        }, 80);
    };

    function initVisibleFinanceAccountSelect2() {
        var panel = document.getElementById('accountForm');
        if (panel && panel.classList.contains('show')) {
            initAccountSelect2(panel, true);
            return;
        }
        var editForm = document.querySelector('form.finance-account-form');
        if (editForm) {
            initAccountSelect2(editForm, true);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initVisibleFinanceAccountSelect2);
    } else {
        initVisibleFinanceAccountSelect2();
    }
})();
</script>
