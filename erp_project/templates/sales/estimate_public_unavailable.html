<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation unavailable</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: #334155;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 32px 28px;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
        }
        h1 {
            font-size: 1.125rem;
            margin: 0 0 12px;
            color: #0f172a;
        }
        p {
            margin: 0;
            line-height: 1.5;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Quotation unavailable</h1>
        <p>{{ message }}</p>
    </div>
</body>
</html>
