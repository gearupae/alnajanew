{% if public_portal_links %}
<section class="public-portal-section {% if portal_stack == 'login' %}public-portal-section--login mt-4{% else %}public-portal-section--dashboard mt-4 mb-0{% endif %}"
         aria-labelledby="public-portal-heading">
    <div class="public-portal-sky-band" aria-hidden="true"></div>
    <header class="public-portal-header">
        <div class="public-portal-header-badge" aria-hidden="true">
            <i class="fas fa-door-open"></i>
        </div>
        <div>
            <h2 id="public-portal-heading" class="public-portal-title">Public self-service</h2>
            <p class="public-portal-subtitle">Quick links for staff and partners — no ERP login needed.</p>
            <span class="public-portal-chip">
                <i class="fas fa-unlock-alt" aria-hidden="true"></i> Open access
            </span>
        </div>
    </header>
    <div class="public-portal-grid">
        {% for link in public_portal_links %}
        <a href="{{ link.url }}"
           class="public-portal-tile"
           target="_blank"
           rel="noopener noreferrer"
           title="{{ link.description }}">
            <span class="public-portal-tile-icon" aria-hidden="true">
                <i class="fas {{ link.icon }}"></i>
            </span>
            <span class="public-portal-tile-body">
                <span class="public-portal-tile-title">{{ link.title }}</span>
                <span class="public-portal-tile-desc">{{ link.description }}</span>
            </span>
            <i class="fas fa-arrow-right public-portal-tile-arrow" aria-hidden="true"></i>
        </a>
        {% endfor %}
    </div>
</section>
{% endif %}
