{% if public_portal_links %}
<div class="card border-0 shadow-sm mb-4">
    <div class="card-header bg-transparent py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
        <h6 class="mb-0 fw-semibold"><i class="fas fa-link me-2 text-dark"></i>Public self-service links</h6>
        <span class="small text-muted">No login required — share with staff and site teams</span>
    </div>
    <div class="card-body pt-0">
        <div class="row g-2 g-md-3">
            {% for link in public_portal_links %}
            <div class="col-md-6 col-xl-4">
                <a href="{{ link.url }}" class="d-flex gap-3 align-items-start text-decoration-none border rounded p-3 h-100 public-portal-tile" target="_blank" rel="noopener noreferrer">
                    <span class="flex-shrink-0 text-muted pt-1"><i class="fas {{ link.icon }} fa-lg"></i></span>
                    <span class="min-w-0">
                        <span class="fw-semibold text-dark d-block">{{ link.title }}</span>
                        <span class="small text-muted d-block">{{ link.description }}</span>
                        <code class="small text-muted d-block mt-1 text-truncate">{{ link.path }}</code>
                    </span>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}
