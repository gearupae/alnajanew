{% if public_portal_links %}
<div class="card border-0 shadow-sm {% if portal_stack == 'login' %}public-portal-card-login mt-4{% else %}mb-0 mt-4{% endif %}">
    <div class="card-header bg-transparent py-3">
        <h6 class="mb-0 fw-semibold text-center text-md-start">
            <i class="fas fa-link me-2 {% if portal_stack == 'login' %}text-muted{% else %}text-dark{% endif %}"></i>Public self-service links
        </h6>
        <p class="small text-muted mb-0 mt-1 text-center text-md-start">No login required — open any link below.</p>
    </div>
    <div class="card-body pt-0">
        <div class="row g-2">
            {% for link in public_portal_links %}
            <div class="col-12 col-sm-6">
                <a href="{{ link.url }}"
                   class="btn {% if portal_stack == 'login' %}btn-outline-dark{% else %}btn-outline-primary{% endif %} w-100 text-start d-flex align-items-start gap-2 py-2 px-3 public-portal-btn"
                   target="_blank"
                   rel="noopener noreferrer"
                   title="{{ link.description }}">
                    <i class="fas {{ link.icon }} mt-1 flex-shrink-0"></i>
                    <span class="min-w-0">
                        <span class="d-block fw-semibold">{{ link.title }}</span>
                        <span class="d-block small {% if portal_stack == 'login' %}text-muted{% else %}opacity-75{% endif %} fw-normal">{{ link.description }}</span>
                    </span>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}
